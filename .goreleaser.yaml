version: 2
before:
  hooks:
    - go mod tidy
    # - go test -v ./...
    - go generate ./...
builds:
  # Linux needs CGO for the ALSA audio backend (ebitengine/oto/v3),
  # so this build runs natively on the release runner.
  - id: cuc-cgo
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    # ensures mod timestamp to be the commit timestamp
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
    # trims path
      - -trimpath
    ldflags:
    # use commit date instead of current date as main.date
    # only needed if you actually use those things in your main package, otherwise can be ignored.
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{ .CommitDate }}
  # Cross-compiled without CGO. Windows keeps full audio support
  # (ebitengine/oto/v3 is pure Go there); the other targets fall back
  # to a silent player (internal/music_noaudio.go) but the URL checker
  # itself is fully functional.
  - id: cuc-nocgo
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      # linux/amd64 with audio comes from the cuc-cgo build
      - goos: linux
        goarch: amd64
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{ .CommitDate }}
archives:
  - id: cuc
    name_template: >-
          {{ .ProjectName }}_
          {{- title .Os }}_
          {{- if eq .Arch "amd64" }}x86_64
          {{- else if eq .Arch "386" }}i386
          {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ['zip']
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

sboms:
  - artifacts: binary #archive
  - id: source # Two different sbom configurations need two different IDs
    artifacts: source

dockers:
- image_templates:
  - 'davidaparicio/cuc:{{ .Tag }}'
  dockerfile: Dockerfile
  build_flag_templates:
  - "--pull"
  - "--label=org.opencontainers.image.created={{.Date}}"
  - "--label=org.opencontainers.image.name={{.ProjectName}}"
  - "--label=org.opencontainers.image.revision={{.FullCommit}}"
  - "--label=org.opencontainers.image.version={{.Version}}"
  - "--label=org.opencontainers.image.source={{.GitURL}}"

docker_signs:
  #https://goreleaser.com/customization/docker_sign/
  - cmd: cosign
    env:
    - COSIGN_EXPERIMENTAL=1
    artifacts: images
    output: true
    args:
    - "sign"
    #- "--key=cosign.key"
    #- "--upload=false"
    - "${artifact}"
    - "--yes" # needed on cosign 2.0.0+

brews:
- name: cuc
  # goarm: 6
  homepage: https://github.com/davidaparicio/homebrew-tools
  repository:
    owner: davidaparicio
    name: homebrew-tools